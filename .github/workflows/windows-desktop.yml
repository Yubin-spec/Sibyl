name: Windows desktop technical build

on:
  workflow_dispatch:
  push:
    branches:
      - codex/windows-desktop

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node 26
        uses: actions/setup-node@v4
        with:
          node-version: 26.12.1

      - name: Run Node tests
        run: npm test

      - name: Bundle Windows Node runtime
        run: |
          New-Item -ItemType Directory -Force runtime/windows | Out-Null
          $node = node -p "process.execPath"
          Copy-Item -LiteralPath $node -Destination runtime/windows/node.exe -Force
          & .\runtime\windows\node.exe --version

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Build NSIS installer
        run: npx --yes @tauri-apps/cli@2 build
        env:
          CI: "true"

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: Agents-Calling-Windows-technical
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14
